# Release builds, run by .github/workflows/release.yml on tag push.
# Local dry run (needs zig and cargo-zigbuild): goreleaser release --snapshot --clean
version: 2

project_name: git-credential-1password

before:
  hooks:
    - cargo fetch --locked

builds:
  - builder: rust
    command: zigbuild
    flags:
      - --release
      - --locked
    targets:
      # musl: fully static binaries
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      # gnu/gnullvm: no Visual C++ runtime needed
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm

archives:
  # <name>_<version>_<os>_<arch>, as used by the README's verify instructions
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
