name: Update flake.lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update lock
        run: nix flake update

      # PRs opened with GITHUB_TOKEN don't trigger the Tests workflow,
      # so make sure the updated lock still builds before opening one
      - name: Build
        run: nix build .#default -L

      - name: Smoke test
        run: ./result/bin/git-credential-1password --version

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: |
            `nix flake update`, triggered manually.

            `nix build .#default` and `--version` passed in the workflow run that opened this PR.
          add-paths: flake.lock
